<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Candor Console</title>
<meta name="description" content="A long-running Claude Code job overseen by Candor: its checkpoints, drift against the goal, restarts, ledger and signed trust receipt, all checked in your browser.">
<link rel="stylesheet" href="css/console.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">Candor</div>
        <div class="tag">Oversight for long-running Claude Code jobs</div>
      </div>
    </div>
    <a class="btn primary" href="workspace.html">Run a job yourself</a>
    <label class="picker">
      <span class="sr-only">Recorded run</span>
      <select id="run-select"></select>
    </label>
  </div>
</header>

<main class="wrap" id="main">
  <section class="hero" aria-labelledby="run-title">
    <div class="hero-text">
      <h1 id="run-title">Loading the run…</h1>
      <p id="run-meta" class="meta"></p>
    </div>
    <button id="integrity" class="integrity pending" type="button" aria-expanded="false" aria-controls="integrity-detail">Checking the record…</button>
  </section>
  <p id="integrity-detail" class="integrity-detail" hidden></p>

  <section class="verdicts" id="verdicts" aria-label="The two verdicts of the trust receipt"></section>

  <section class="panel map-panel" aria-labelledby="map-title">
    <div class="panel-head">
      <h2 id="map-title">Run map</h2>
      <div class="levels" id="levels"></div>
    </div>
    <p id="map-caption" class="caption"></p>
    <div id="suggestion" class="suggestion" role="status"></div>
    <div class="map-scroll"><div id="map"></div></div>
    <ul class="legend" id="legend" aria-label="Legend"></ul>
  </section>

  <section class="panel detail" aria-label="The selected checkpoint">
    <div id="detail-head" class="detail-head"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-checkpoint" aria-controls="view-checkpoint" aria-selected="true">Checkpoint</button>
      <button role="tab" id="tab-rules" aria-controls="view-rules" aria-selected="false">Rules</button>
      <button role="tab" id="tab-ledger" aria-controls="view-ledger" aria-selected="false">Ledger</button>
      <button role="tab" id="tab-receipt" aria-controls="view-receipt" aria-selected="false">Receipt</button>
    </div>
    <div role="tabpanel" id="view-checkpoint" aria-labelledby="tab-checkpoint" class="view"></div>
    <div role="tabpanel" id="view-rules" aria-labelledby="tab-rules" class="view" hidden></div>
    <div role="tabpanel" id="view-ledger" aria-labelledby="tab-ledger" class="view" hidden></div>
    <div role="tabpanel" id="view-receipt" aria-labelledby="tab-receipt" class="view" hidden></div>
  </section>
</main>

<footer class="wrap foot">
  <p>Candor gives evidence, not proof. The record is tamper-evident on one machine, not tamper-proof. Source on <a href="https://github.com/tkorcode/candor">GitHub</a>.</p>
</footer>
</body>
</html>
